<div class="animated fadeIn">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-header">
          <div class="row border-title">
            <div class="col-md-12">
              <strong>{{ title }}</strong>
            </div>
          </div>
        </div>
        <div class="card-body">
          <form class="form-horizontal border-shadow"
                autocomplete="off">
            <div class="row ">

              <div class="col-xxl-2 col-xl-2 col-lg-4 col-sm-12 col-md-6 ">
                <label class="badge badge-warning"> {{"OrganizationManagement.DirectWorkTypeAndSectionSetting.EffectiveDate" | translate }} </label>
                <div class="full-width">
                  <div class="container_date">
                    <div class="input-group mr-1">
                      <input autocomplete="off"
                             (keydown.backspace)="date = null"
                             onkeypress="return false;"
                             onpaste="return false;"
                             type="text"
                             placeholder='{{"OrganizationManagement.DirectWorkTypeAndSectionSetting.EffectiveDate" | translate }}'
                             class="form-control"
                             name="date"
                             [(ngModel)]="date"
                             bsDatepicker
                             [bsConfig]="{ isAnimated: true,  minMode: 'month' ,dateInputFormat: 'YYYY/MM' }" />
                      <div class="input-group-append">
                        <span class="input-group-text"><i class="{{iconButton.CALENDAR}}"></i></span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-12 p-0">
              <label class="d-block">&nbsp;</label>
              <button type="submit"
                      class="btn btn-primary"
                      (click)="search(true)"
                      *ngIf="functionUtility.checkFunction('Search')">
                <i class="{{ iconButton.SEARCH }}"></i> {{"System.Action.Search" | translate }}
              </button>
              <button type="button"
                      class="btn btn-danger ml-1"
                      (click)="clear(true)">
                <i class="{{ iconButton.CLEAR }}"></i> {{"System.Action.Clear" | translate }}
              </button>
              <button type="button"
                      (click)="playButton()"
                      class="btn btn-success ml-1"
                      id="playButton">
                <i class="{{ iconButton.ADD }}"></i> Play
              </button>
            </div>
          </form>
          <div class="row justify-content-md-center">
            <div class="col-lg-12 col-md-12 col-sm-12 row">
              <div class="col-4"
                   *ngFor="let item of charts; let i = index">
                <div class="chart-header">
                  <div class="header-row category-id-header">Category ID</div>
                  <div class="header-row category-value">{{ item.category }}</div>
                  <div class="header-row defect-title">QC TOP 5 Model Defects</div>
                </div>
                <div style="display: block">
                  <canvas baseChart
                          [datasets]="item.data"
                          [labels]="item.labels"
                          [options]="item.options"
                          [legend]="barChartLegend"
                          [type]="barChartType"
                          (chartHover)="chartHovered($event)"
                          (chartClick)="chartClicked($event)"></canvas>
                </div>
                <!-- <button mat-button
                      (click)="randomize()">Update</button> -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
